name: piedemonte-forest

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: piedemonte_forest_postgis
    environment:
      POSTGRES_DB: piedemonte_forest
      POSTGRES_USER: piedemonte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
